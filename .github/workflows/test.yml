name: Smoke tests
on:
  push:
    branches: ['main', 'feat/**', 'fix/**']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.mjs
      - run: node --check public/app.js
      - run: node --check public/pixel-art.js
      - run: node --check public/physics.js
      - run: node --check public/emergence.js
      - run: node --check public/biology.js
      - run: node --check public/frontier.js
      - run: node --check public/civilization.js
      - run: node --check public/receipts.js
      - run: node --check public/activities.js
      - run: node --check public/world-runtime.js
      - run: node --check public/persistence.js
      - run: node --check public/simulation.js
      - run: node --check scripts/headless.mjs
      - run: node --check scripts/benchmarks.mjs
      - run: node scripts/headless.mjs 10000 379210
      - run: node scripts/headless.mjs 200 379210 --auto --trace=receipt-trace.jsonl
      - run: node scripts/benchmarks.mjs --soak-days=30
      - run: node --test tests/*.test.mjs
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows scripts without downloading binaries
        shell: powershell
        run: .\tests\installer.test.ps1
